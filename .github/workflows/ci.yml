name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The enforced end-to-end gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - run: npm run test:e2e

  # WebKit is enforced too: departed peers tear down via the crypto
  # DataChannel close (the only signal Safari gives), so the survivor
  # ledger is honest on the engine real iOS/macOS users bring.
  e2e-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - run: npm run test:e2e:webkit

  # Firefox, enforced (2026-10-17). The engine that fails differently: its
  # audio device comes from e2e/with-audio-device.sh — without one its
  # AudioContext never leaves "suspended", every dial bails with AUDIO NOT
  # READY, and (before the unlock learned to dial once the context runs)
  # nothing ever retried. Its microphone permission is pre-approved via
  # firefoxUserPrefs: Playwright Firefox has no 'microphone' permission name
  # at all, so grantPermissions throws.
  e2e-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit ${{ matrix.browser }}
      # Firefox needs an output device or its AudioContext never leaves
      # "suspended" (recipe, evidence and the one-step rule: see
      # e2e/with-audio-device.sh). Setup and the tests must share ONE step —
      # the PulseAudio daemon does not survive a step boundary.
      - run: npm run build
      - name: firefox session — audio device + tests
        run: e2e/with-audio-device.sh npm run test:e2e:${{ matrix.browser }}
        env:
          WLK1_AUDIO_DEVICE: '1'
      # The app's mesh log is the only evidence a Firefox failure has:
      # which leg never dialed, and why. Written per test, kept out of stdout.
      - name: app log
        if: failure()
        run: jq -r '"\(.browser) \(.level) \(.text)"' test-results/logs/*.jsonl || cat test-results/logs/*.jsonl

  # Cross-engine sessions: the pair real users actually produce. Same-engine
  # lanes cannot see bugs that only appear when the two ends differ — the
  # DataChannel deadlock that looped Brave<->Firefox forever passed every
  # chromium lane and every webkit lane. Enforced: both pairings, both ways.
  e2e-cross-engine:
    # A cross-engine session launches TWO whole browsers on top of the one
    # Playwright runs, and a stock runner (~4GB, all three engines installed)
    # kills the second at launch. max-parallel: 1 keeps two runners from
    # competing as well.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair:
          - chromium:webkit
          - chromium:firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      # One step for the setup and the command: see e2e/with-audio-device.sh.
      # EVERY pair gets the device, not just the firefox ones: a device-less
      # WebKit engine drives its audio pipeline off a starving timer instead of
      # a device clock, and the tone it sends arrives with dropped samples
      # (measured: 941Hz for a 1000Hz tone in this pairing, while the same
      # WebKit->chromium and WebKit->firefox tones measure clean in the triple
      # lane, which has the sink). The engine is what is on trial here.
      - name: cross-engine session ${{ matrix.pair }}
        run: e2e/with-audio-device.sh npx playwright test e2e/batch-1x1.spec.ts -g "cross-engine" --project=chromium --workers=1
        env:
          E2E_CROSS_PAIRS: ${{ matrix.pair }}
          E2E_BATCH: 1
          WLK1_AUDIO_DEVICE: '1'
      - name: app log
        if: failure()
        run: jq -r '"\(.browser) \(.level) \(.text)"' test-results/logs/*.jsonl || cat test-results/logs/*.jsonl
      # What the failing engine actually DELIVERED: freq/duration/rms cannot
      # say whether that was the tone plus clicks or nothing at all, and the
      # recorded audio can. Only kept when a test fails.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audio-${{ replace(matrix.pair, ':', '-') }}
          path: test-results/audio
          if-no-files-found: ignore

  # The deploy shape. Pages serves this app under /wlk1-ghostcom/, where
  # root-absolute asset URLs, the service-worker scope and the manifest all
  # break — a class of failure that no root-served lane can see, and that
  # used to reach production because CI built with a different base than the
  # deploy job. Same dist, served the way Pages serves it.
  e2e-subpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          BASE_PATH: /wlk1-ghostcom/
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:4173/wlk1-ghostcom

  # The three-engine room: one session, three browsers, one mesh. A pair
  # proves a leg between two engines; only a triple proves that every unit
  # links to both others, that all six legs are transforming real frames, and
  # that a departure leaves the survivors honest.
  #
  # Enforced (2026-10-17), with the resource risk named instead of hidden:
  # three extra browser processes on top of the one Playwright runs is the OOM
  # edge of a ~4 GB runner — the pair job above already needs max-parallel: 1
  # for two. If it ever reds with "Target page, context or browser has been
  # closed", that is memory, and the step list is where to buy some back.
  e2e-triple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      # One step for the setup and the command: see e2e/with-audio-device.sh.
      - name: three-engine session — audio device + tests
        run: e2e/with-audio-device.sh npm run test:e2e:triple
        env:
          WLK1_AUDIO_DEVICE: '1'
      - name: app log
        if: failure()
        run: jq -r '"\(.browser) \(.level) \(.text)"' test-results/logs/*.jsonl || ls -R test-results
      # Same reason as the cross-engine lane: keep the recorded tone when it
      # fails, so a wrong reading can be heard instead of guessed at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audio-triple
          path: test-results/audio
          if-no-files-found: ignore
