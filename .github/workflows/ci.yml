name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The enforced end-to-end gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - run: npm run test:e2e

  # WebKit is enforced too: departed peers tear down via the crypto
  # DataChannel close (the only signal Safari gives), so the survivor
  # ledger is honest on the engine real iOS/macOS users bring.
  e2e-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - run: npm run test:e2e:webkit

  # Firefox — kept advisory (continue-on-error) until one green run proves
  # the engine end to end, then flip it into the enforced set. Its earlier
  # red was a HARNESS bug, not the browser: Playwright Firefox has no
  # 'microphone' permission name, so grantPermissions threw and failed
  # every test. The engine is now pre-approved via firefoxUserPrefs.
  e2e-matrix:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit ${{ matrix.browser }}
      # Firefox's AudioContext never leaves "suspended" without an output
      # device to open: the app's silent carrier never runs, the mesh refuses
      # to dial, and every test fails at LNK 1 with "AUDIO NOT READY (ctx
      # suspended)" and wire enc=0 dec=0. Prefs do not help (autoplay is not
      # the blocker) and neither does ALSA — the firefox-audio-probe workflow
      # measured both, and then measured that a PulseAudio server with a null
      # SINK fixes 7/7 candidates. The sink is VERIFIED here, not hoped for:
      # a masked failure in this step read as an app bug for a whole day.
      # Scoped to Firefox lanes: the chromium and webkit lanes pass without it.
      - name: give the runner an audio device
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          export XDG_RUNTIME_DIR=/tmp/wlk1-pa
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --disallow-exit
          pactl load-module module-null-sink sink_name=wlk1_dummy
          pactl set-default-sink wlk1_dummy
          pactl list short sinks
          pactl list short sinks | grep -q wlk1_dummy || { echo "NO NULL SINK — Firefox has no audio device"; exit 1; }
          # The browser is a PulseAudio CLIENT: it must find that server.
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "PULSE_SERVER=unix:$XDG_RUNTIME_DIR/pulse/native" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run test:e2e:${{ matrix.browser }}
      # The app's mesh log is the only evidence a Firefox failure has:
      # which leg never dialed, and why. Written per test, kept out of stdout.
      - name: app log
        if: failure()
        run: jq -r '"\(.browser) \(.level) \(.text)"' test-results/logs/*.jsonl || cat test-results/logs/*.jsonl

  # Cross-engine sessions: the pair real users actually produce. Same-engine
  # lanes cannot see bugs that only appear when the two ends differ — the
  # DataChannel deadlock that looped Brave<->Firefox forever passed every
  # chromium lane and every webkit lane. Enforced: both pairings, both ways.
  e2e-cross-engine:
    # A cross-engine session launches TWO whole browsers on top of the one
    # Playwright runs, and a stock runner (~4GB, all three engines installed)
    # kills the second at launch. max-parallel: 1 keeps two runners from
    # competing as well.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair:
          - chromium:webkit
          - chromium:firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: give the runner an audio device
        if: contains(matrix.pair, 'firefox')
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          export XDG_RUNTIME_DIR=/tmp/wlk1-pa
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --disallow-exit
          pactl load-module module-null-sink sink_name=wlk1_dummy
          pactl set-default-sink wlk1_dummy
          pactl list short sinks
          pactl list short sinks | grep -q wlk1_dummy || { echo "NO NULL SINK — Firefox has no audio device"; exit 1; }
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "PULSE_SERVER=unix:$XDG_RUNTIME_DIR/pulse/native" >> "$GITHUB_ENV"
      - run: npm run build
      - name: cross-engine session ${{ matrix.pair }}
        run: npx playwright test e2e/batch-1x1.spec.ts -g "cross-engine" --project=chromium --workers=1
        env:
          E2E_CROSS_PAIRS: ${{ matrix.pair }}
          E2E_BATCH: 1
      - name: app log
        if: failure()
        run: jq -r '"\(.browser) \(.level) \(.text)"' test-results/logs/*.jsonl || cat test-results/logs/*.jsonl

  # The deploy shape. Pages serves this app under /wlk1-ghostcom/, where
  # root-absolute asset URLs, the service-worker scope and the manifest all
  # break — a class of failure that no root-served lane can see, and that
  # used to reach production because CI built with a different base than the
  # deploy job. Same dist, served the way Pages serves it.
  e2e-subpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          BASE_PATH: /wlk1-ghostcom/
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:4173/wlk1-ghostcom

  # The three-engine room: one session, three browsers, one mesh. A pair
  # proves a leg between two engines; only a triple proves that every unit
  # links to both others, that all six legs are transforming real frames, and
  # that a departure leaves the survivors honest.
  #
  # Advisory (continue-on-error) for a resource reason, not a correctness one:
  # three extra browser processes on top of the one Playwright runs is the OOM
  # edge of a ~4 GB runner — the pair job above already needs max-parallel: 1
  # for two. Every leg it checks is also covered by the enforced pairs; what it
  # adds is coverage of the mesh rather than of a leg.
  e2e-triple:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      # Firefox's AudioContext never leaves "suspended" without an output
      # device to open: the app's silent carrier never runs, the mesh refuses
      # to dial, and every test fails at LNK 1 with "AUDIO NOT READY (ctx
      # suspended)" and wire enc=0 dec=0. Prefs do not help (autoplay is not
      # the blocker) and neither does ALSA — the firefox-audio-probe workflow
      # measured both, and then measured that a PulseAudio server with a null
      # SINK fixes 7/7 candidates. The sink is VERIFIED here, not hoped for:
      # a masked failure in this step read as an app bug for a whole day.
      # Scoped to Firefox lanes: the chromium and webkit lanes pass without it.
      - name: give the runner an audio device
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          export XDG_RUNTIME_DIR=/tmp/wlk1-pa
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --disallow-exit
          pactl load-module module-null-sink sink_name=wlk1_dummy
          pactl set-default-sink wlk1_dummy
          pactl list short sinks
          pactl list short sinks | grep -q wlk1_dummy || { echo "NO NULL SINK — Firefox has no audio device"; exit 1; }
          # The browser is a PulseAudio CLIENT: it must find that server.
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "PULSE_SERVER=unix:$XDG_RUNTIME_DIR/pulse/native" >> "$GITHUB_ENV"
      - run: npm run build
      - name: three-engine session
        run: npm run test:e2e:triple
      - name: app log
        if: failure()
        run: jq -r '"\(.browser) \(.level) \(.text)"' test-results/logs/*.jsonl || ls -R test-results
