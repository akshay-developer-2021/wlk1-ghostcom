name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The enforced end-to-end gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
        env:
          BASE_PATH: /wlk1-ghostcom/
      - run: npm run test:e2e

  # WebKit is enforced too: departed peers tear down via the crypto
  # DataChannel close (the only signal Safari gives), so the survivor
  # ledger is honest on the engine real iOS/macOS users bring.
  e2e-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
        env:
          BASE_PATH: /wlk1-ghostcom/
      - run: npm run test:e2e:webkit

  # Firefox — kept advisory (continue-on-error) until one green run proves
  # the engine end to end, then flip it into the enforced set. Its earlier
  # red was a HARNESS bug, not the browser: Playwright Firefox has no
  # 'microphone' permission name, so grantPermissions threw and failed
  # every test. The engine is now pre-approved via firefoxUserPrefs.
  e2e-matrix:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit ${{ matrix.browser }}
      - run: npm run build
        env:
          BASE_PATH: /wlk1-ghostcom/
      - run: npm run test:e2e:${{ matrix.browser }}
      # The app's mesh log is the only evidence a Firefox failure has:
      # which leg never dialed, and why. Written per test, kept out of stdout.
      - name: app log
        if: failure()
        run: jq -r '"\(.browser) \(.level) \(.text)"' test-results/logs/*.jsonl || cat test-results/logs/*.jsonl

  # Cross-engine sessions: the pair real users actually produce. Same-engine
  # lanes cannot see bugs that only appear when the two ends differ — the
  # DataChannel deadlock that looped Brave<->Firefox forever passed every
  # chromium lane and every webkit lane. Enforced: both pairings, both ways.
  e2e-cross-engine:
    # A cross-engine session launches TWO whole browsers on top of the one
    # Playwright runs, and a stock runner (~4GB, all three engines installed)
    # kills the second at launch. max-parallel: 1 keeps two runners from
    # competing as well.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair:
          - chromium:webkit
          - chromium:firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
        env:
          BASE_PATH: /wlk1-ghostcom/
      - name: cross-engine session ${{ matrix.pair }}
        run: npx playwright test e2e/batch-1x1.spec.ts -g "cross-engine" --project=chromium --workers=1
        env:
          E2E_CROSS_PAIRS: ${{ matrix.pair }}
          E2E_BATCH: 1
      - name: app log
        if: failure()
        run: jq -r '"\(.browser) \(.level) \(.text)"' test-results/logs/*.jsonl || cat test-results/logs/*.jsonl